[project]
name = "webhooksite"
version = "0.1.0"
description = "Call one GET endpoint derived from a redacted browser request."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agentis",
    "httpx>=0.27",
]

[project.scripts]
webhooksite = "webhooksite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webhooksite"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
agentis = { path = "/Users/ivor/src/tries/2026-08-06-agentis-cli-fw", editable = true }

[tool.hatch.build.targets.wheel.force-include]
"src/webhooksite/endpoint.json" = "webhooksite/endpoint.json"
