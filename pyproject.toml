[project]
name = "har2cli"
version = "0.1.0"
description = "Turn authenticated browser HAR flows into safe agtcli scaffolds."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agtcli>=0.1.2",
    "httpx>=0.27",
]

[project.scripts]
har2cli = "har2cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/har2cli"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
